spring.application.name=TaskBrother
spring.datasource.url=jdbc:postgresql://${DB_HOST:DB_HOST_CI}:${DB_PORT:DB_PORT_CI}/${DB_NAME:DB_NAME_CI}
spring.datasource.username=${DB_USER:DB_USER_CI}
spring.datasource.password=${DB_PASSWORD:DB_PASSWORD_CI}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8888
